pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.kikugie.dev/snapshots" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "${stonecutter_version}"
}

stonecutter {
	kotlinController = false
	centralScript = "build.gradle"

	create(getRootProject()) {
		versions "26.2", "26.3"
	}
}
